<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="planet" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8c97a"/>
      <stop offset="40%" stop-color="#c9a44a"/>
      <stop offset="80%" stop-color="#8a6d2b"/>
      <stop offset="100%" stop-color="#5c4518"/>
    </radialGradient>
    <radialGradient id="ring1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4b87a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a08050" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a6fa5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a3a7a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Planet shadow -->
  <ellipse cx="100" cy="115" rx="38" ry="12" fill="rgba(0,0,0,0.15)"/>

  <!-- Back ring (behind planet) -->
  <ellipse cx="100" cy="95" rx="72" ry="22" fill="none" stroke="url(#ring1)" stroke-width="5" opacity="0.5"
    clip-path="url(#ringClipBack)"/>

  <!-- Planet body -->
  <circle cx="100" cy="90" r="38" fill="url(#planet)"/>

  <!-- Planet bands -->
  <ellipse cx="100" cy="78" rx="36" ry="4" fill="rgba(180,150,80,0.3)"/>
  <ellipse cx="100" cy="90" rx="38" ry="3" fill="rgba(160,130,60,0.25)"/>
  <ellipse cx="100" cy="100" rx="35" ry="4" fill="rgba(140,110,50,0.2)"/>

  <!-- Planet highlight -->
  <ellipse cx="88" cy="78" rx="14" ry="18" fill="rgba(255,240,200,0.2)"/>

  <!-- Front ring (in front of planet) -->
  <path d="M 28,95 Q 60,72 100,68 Q 140,72 172,95" fill="none" stroke="url(#ring1)" stroke-width="5" opacity="0.8"/>
  <path d="M 28,95 Q 60,72 100,68 Q 140,72 172,95" fill="none" stroke="rgba(220,200,150,0.3)" stroke-width="8"/>

  <!-- Subtle glow -->
  <circle cx="100" cy="90" r="50" fill="url(#glow)" opacity="0.15"/>
</svg>
